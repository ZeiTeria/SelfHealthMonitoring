{% extends "base.html" %}
{% from "_komponen.html" import tabel_catatan with context %}

{% block judul %}
	Aktivitas
{% endblock %}

{% block isi %}
	<h1>Log aktivitas fisik</h1>
	<form method="post" class="form">
	  <input type="hidden" name="csrf" value="{{ csrf_token }}">
		<div class="baris">
			<label>
				Tanggal
				<input name="tanggal" type="date" value="{{ hari }}" required>
			</label>
			<label>
				Aktivitas
				<select name="aktivitas" required>
					{% for id, nama, met in pilihan %}
						<option value="{{ id }}">{{ nama }} (MET {{ met }})</option>
					{% endfor %}
				</select>
			</label>
			<label>
				Durasi (menit)
				<input name="durasi" type="number" min="1" max="1440" required>
			</label>
		</div>
		<p class="sub">Kalori terbakar = MET × berat badan (kg) × durasi (jam).</p>
		<button type="submit">Simpan</button>
	</form>

	<h2>Catatan terbaru</h2>
	{{ tabel_catatan(daftar) }}
{% endblock %}
