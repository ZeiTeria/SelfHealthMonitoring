{% extends "base.html" %}
{% from "_komponen.html" import tabel_catatan %}

{% block judul %}
	Makanan
{% endblock %}

{% block isi %}
	<h1>Log makanan</h1>
	<form method="post" class="form">
		<input type="hidden" name="csrf" value="{{ csrf_token }}">
		<div class="baris">
			<label>
				Tanggal
				<input name="tanggal" type="date" value="{{ hari }}" required>
			</label>
			<label>
				Nama makanan
				<input name="nama_makanan" required autofocus>
			</label>
			<label>
				Kalori (kkal)
				<input name="kalori" type="number" step="any" min="0" max="10000" required>
			</label>
		</div>
		<button type="submit">Simpan</button>
	</form>
	<h2>Catatan terbaru</h2>
	{{ tabel_catatan(daftar) }}
{% endblock %}
